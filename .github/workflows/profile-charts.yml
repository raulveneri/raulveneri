name: Update profile charts
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-charts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix charts-generator --ignore-scripts
      - name: Fetch public GitHub data and render charts
        run: |
          node charts-generator/actualizar-datos.mjs
          node charts-generator/construir.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.es.md assets/en/lenguajes.svg assets/en/actividad.svg assets/es/lenguajes.svg assets/es/actividad.svg charts-generator/datos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update profile charts'
            git push
          fi
