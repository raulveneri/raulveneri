<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="264" viewBox="0 0 1200 264" role="img" aria-labelledby="raulveneri-development_stack_title raulveneri-development_stack_description">
<title id="raulveneri-development_stack_title">Python, JavaScript, TypeScript, Astro, Tailwind CSS y Cloudflare.</title>
<desc id="raulveneri-development_stack_description">Python, JavaScript, TypeScript, Astro, Tailwind CSS y Cloudflare. Ilustración original. Las animaciones terminan antes de cinco segundos.</desc>
