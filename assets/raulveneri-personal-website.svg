<svg xmlns="http://www.w3.org/2000/svg" width="810" height="600" viewBox="0 0 810 600" role="img" aria-labelledby="raulveneri-personal_website_title raulveneri-personal_website_description">
<title id="raulveneri-personal_website_title">Raúl Veneri. Marketing con IA y mi web como laboratorio.</title>
<desc id="raulveneri-personal_website_description">Raúl Veneri. Marketing con IA y mi web como laboratorio. Ilustración original. Las animaciones terminan antes de cinco segundos.</desc>
<defs>
 <linearGradient id="raulveneri-personal_website_background" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset="1" stop-color="#080f1b"/></linearGradient>
 <pattern id="raulveneri-personal_website_grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#23364d" stroke-opacity=".45"/></pattern>
</defs>
<style>
 text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
 .raulveneri-circuit_trace { stroke-dasharray: 12 16; animation: raulveneri-flow 4.6s ease-out 1; }
 .raulveneri-panel_reveal { animation: raulveneri-reveal 1s ease-out 1 backwards; }
 @keyframes raulveneri-flow { from {stroke-dashoffset: 224;} to {stroke-dashoffset: 0;} }
