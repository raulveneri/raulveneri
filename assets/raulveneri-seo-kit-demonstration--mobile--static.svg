<text x="36" y="96" font-size="74" fill="#242321" font-weight="700" letter-spacing="-3">SEO Kit</text><text x="36" y="157" font-size="37" fill="#242321" font-weight="400" >Analiza tu web.</text><text x="36" y="206" font-size="37" fill="#242321" font-weight="400" >Entiende qué falla.</text><text x="36" y="255" font-size="37" fill="#ad3d28" font-weight="600" >Decide qué cambiar.</text><path d="M36 298H604" stroke="#c9c2b8"/><text x="36" y="354" font-size="21" fill="#615c55" font-weight="400" >EJEMPLO DOCUMENTADO · WEB LOCAL</text><g class="raulveneri-demo_stage raulveneri-demo_stage--request"><text x="36" y="418" font-size="22" fill="#ad3d28" font-weight="600" >01 / LA PETICIÓN</text><text x="36" y="482" font-size="32" fill="#242321" font-weight="600" >Auditar dos páginas.</text><text x="36" y="529" font-size="32" fill="#242321" font-weight="600" >Revisar técnica y contenido.</text><text x="36" y="594" font-size="27" fill="#615c55" font-weight="400" >Análisis de HTML compilado.</text><text x="36" y="631" font-size="27" fill="#615c55" font-weight="400" >Sin modificar la web.</text></g><g class="raulveneri-demo_stage raulveneri-demo_stage--finding"><text x="36" y="418" font-size="22" fill="#ad3d28" font-weight="600" >02 / EL HALLAZGO</text><text x="36" y="482" font-size="32" fill="#242321" font-weight="600" >Un enlace está roto.</text><text x="36" y="529" font-size="32" fill="#242321" font-weight="600" >/about/ → /missing/</text><text x="36" y="594" font-size="27" fill="#615c55" font-weight="400" >La página de destino no existe.</text><text x="36" y="631" font-size="27" fill="#615c55" font-weight="400" >El informe indica dónde ocurre.</text></g><g class="raulveneri-demo_stage raulveneri-demo_stage--decision"><text x="36" y="418" font-size="22" fill="#ad3d28" font-weight="600" >03 / QUÉ HACER</text><text x="36" y="482" font-size="32" fill="#242321" font-weight="600" >Corregir el enlace</text><text x="36" y="529" font-size="32" fill="#242321" font-weight="600" >o recuperar la página.</text><text x="36" y="594" font-size="27" fill="#615c55" font-weight="400" >La opción depende del proyecto.</text><text x="36" y="631" font-size="27" fill="#615c55" font-weight="400" >Tú decides qué tiene sentido.</text></g><text x="36" y="733" font-size="25" fill="#615c55" font-weight="400" >Claude Code · Codex · OpenCode</text><text x="36" y="778" font-size="28" fill="#ad3d28" font-weight="600" >Quiero ver SEO Kit ↗</text>
