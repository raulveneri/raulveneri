<svg xmlns="http://www.w3.org/2000/svg" width="640" height="810" viewBox="0 0 640 810" role="img" aria-labelledby="raulveneri-seo_kit_demonstration__mobile_title raulveneri-seo_kit_demonstration__mobile_description">
<title id="raulveneri-seo_kit_demonstration__mobile_title">SEO Kit: analiza tu web, entiende qué falla y decide qué cambiar. Demostración adaptada del ejemplo documentado.</title>
<desc id="raulveneri-seo_kit_demonstration__mobile_description">SEO Kit: analiza tu web, entiende qué falla y decide qué cambiar. Demostración adaptada del ejemplo documentado. Animación con pausas de lectura. Respeta la preferencia de movimiento reducido.</desc>
<defs></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
.raulveneri-serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
.raulveneri-monospace { font-family: 'DejaVu Sans Mono', Consolas, monospace; }
.raulveneri-demo_stage { opacity: 0; }
.raulveneri-demo_stage--decision { opacity: 1; }

@media (prefers-reduced-motion: no-preference) {
 .raulveneri-heading_underline { animation: raulveneri-underline 12s ease-in-out infinite; transform-origin: 52px 0; }
 .raulveneri-demo_stage--request { animation: raulveneri-request 12s linear infinite; }
 .raulveneri-demo_stage--finding { animation: raulveneri-finding 12s linear infinite; }
 .raulveneri-demo_stage--decision { animation: raulveneri-decision 12s linear infinite; }
 .raulveneri-guide_scroll { animation: raulveneri-scroll 14s ease-in-out infinite; }
 .raulveneri-stack_gesture { transform-box: fill-box; transform-origin: center; }
 .raulveneri-stack_gesture--python { animation: raulveneri-orbit 12s ease-in-out infinite; }
 .raulveneri-stack_gesture--javascript { animation: raulveneri-code 12s ease-in-out 2s infinite; }
 .raulveneri-stack_gesture--typescript { animation: raulveneri-code 12s ease-in-out 4s infinite; }
 .raulveneri-stack_gesture--astro { animation: raulveneri-lift 12s ease-in-out 6s infinite; }
 .raulveneri-stack_gesture--tailwind { animation: raulveneri-wave 12s ease-in-out 8s infinite; }
 .raulveneri-stack_gesture--cloudflare { animation: raulveneri-arrive 12s ease-in-out 10s infinite; }
}
@keyframes raulveneri-underline { 0%, 8%, 100% { transform: scaleX(.3); } 24%, 82% { transform: scaleX(1); } }
@keyframes raulveneri-request { 0%, 30% { opacity: 1; } 33%, 96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes raulveneri-finding { 0%, 30%, 66%, 100% { opacity: 0; } 33%, 63% { opacity: 1; } }
@keyframes raulveneri-decision { 0%, 63%, 100% { opacity: 0; } 66%, 96% { opacity: 1; } }
@keyframes raulveneri-scroll { 0%, 18%, 100% { transform: translateY(0); } 55%, 82% { transform: translateY(-280px); } }
@keyframes raulveneri-orbit { 0%, 3%, 20%, 100% { transform: rotate(0); } 9% { transform: rotate(-12deg); } 14% { transform: rotate(8deg); } }
@keyframes raulveneri-code { 0%, 3%, 20%, 100% { transform: translateX(0); } 9% { transform: translateX(-5px); } 14% { transform: translateX(5px); } }
@keyframes raulveneri-lift { 0%, 3%, 20%, 100% { transform: translateY(0); } 10%, 14% { transform: translateY(-9px); } }
@keyframes raulveneri-wave { 0%, 3%, 20%, 100% { transform: skewX(0); } 9% { transform: skewX(-12deg); } 14% { transform: skewX(9deg); } }
@keyframes raulveneri-arrive { 0%, 3%, 20%, 100% { transform: translateX(0); } 9% { transform: translateX(-7px); } 14% { transform: translateX(3px); } }

@media (prefers-reduced-motion: reduce) {
 *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
<rect width="640" height="810" rx="0" fill="#f5f2ec"/>
<text x="36" y="96" font-size="74" fill="#242321" font-weight="700" letter-spacing="-3">SEO Kit</text><text x="36" y="157" font-size="37" fill="#242321" font-weight="400" >Analiza tu web.</text><text x="36" y="206" font-size="37" fill="#242321" font-weight="400" >Entiende qué falla.</text><text x="36" y="255" font-size="37" fill="#ad3d28" font-weight="600" >Decide qué cambiar.</text><path d="M36 298H604" stroke="#c9c2b8"/><text x="36" y="354" font-size="21" fill="#615c55" font-weight="400" >EJEMPLO DOCUMENTADO · WEB LOCAL</text><g class="raulveneri-demo_stage raulveneri-demo_stage--request"><text x="36" y="418" font-size="22" fill="#ad3d28" font-weight="600" >01 / LA PETICIÓN</text><text x="36" y="482" font-size="32" fill="#242321" font-weight="600" >Auditar dos páginas.</text><text x="36" y="529" font-size="32" fill="#242321" font-weight="600" >Revisar técnica y contenido.</text><text x="36" y="594" font-size="27" fill="#615c55" font-weight="400" >Análisis de HTML compilado.</text><text x="36" y="631" font-size="27" fill="#615c55" font-weight="400" >Sin modificar la web.</text></g><g class="raulveneri-demo_stage raulveneri-demo_stage--finding"><text x="36" y="418" font-size="22" fill="#ad3d28" font-weight="600" >02 / EL HALLAZGO</text><text x="36" y="482" font-size="32" fill="#242321" font-weight="600" >Un enlace está roto.</text><text x="36" y="529" font-size="32" fill="#242321" font-weight="600" >/about/ → /missing/</text><text x="36" y="594" font-size="27" fill="#615c55" font-weight="400" >La página de destino no existe.</text><text x="36" y="631" font-size="27" fill="#615c55" font-weight="400" >El informe indica dónde ocurre.</text></g><g class="raulveneri-demo_stage raulveneri-demo_stage--decision"><text x="36" y="418" font-size="22" fill="#ad3d28" font-weight="600" >03 / QUÉ HACER</text><text x="36" y="482" font-size="32" fill="#242321" font-weight="600" >Corregir el enlace</text><text x="36" y="529" font-size="32" fill="#242321" font-weight="600" >o recuperar la página.</text><text x="36" y="594" font-size="27" fill="#615c55" font-weight="400" >La opción depende del proyecto.</text><text x="36" y="631" font-size="27" fill="#615c55" font-weight="400" >Tú decides qué tiene sentido.</text></g><text x="36" y="733" font-size="25" fill="#615c55" font-weight="400" >Claude Code · Codex · OpenCode</text><text x="36" y="778" font-size="28" fill="#ad3d28" font-weight="600" >Quiero ver SEO Kit ↗</text>
</svg>
